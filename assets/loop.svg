<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#0d1326"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<style>.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@keyframes k0{0%,0.0%{stroke-opacity:.25;fill-opacity:.04}2.0%,14.7%{stroke-opacity:1;fill-opacity:.14}16.7%,100%{stroke-opacity:.25;fill-opacity:.04}}.s0{animation:k0 9.0s linear infinite}@keyframes k1{0%,16.7%{stroke-opacity:.25;fill-opacity:.04}18.7%,31.3%{stroke-opacity:1;fill-opacity:.14}33.3%,100%{stroke-opacity:.25;fill-opacity:.04}}.s1{animation:k1 9.0s linear infinite}@keyframes k2{0%,33.3%{stroke-opacity:.25;fill-opacity:.04}35.3%,48.0%{stroke-opacity:1;fill-opacity:.14}50.0%,100%{stroke-opacity:.25;fill-opacity:.04}}.s2{animation:k2 9.0s linear infinite}@keyframes k3{0%,50.0%{stroke-opacity:.25;fill-opacity:.04}52.0%,64.7%{stroke-opacity:1;fill-opacity:.14}66.7%,100%{stroke-opacity:.25;fill-opacity:.04}}.s3{animation:k3 9.0s linear infinite}@keyframes k4{0%,66.7%{stroke-opacity:.25;fill-opacity:.04}68.7%,81.3%{stroke-opacity:1;fill-opacity:.14}83.3%,100%{stroke-opacity:.25;fill-opacity:.04}}.s4{animation:k4 9.0s linear infinite}@keyframes k5{0%,83.3%{stroke-opacity:.25;fill-opacity:.04}85.3%,98.0%{stroke-opacity:1;fill-opacity:.14}100.0%,100%{stroke-opacity:.25;fill-opacity:.04}}.s5{animation:k5 9.0s linear infinite}</style>
<rect width="1200" height="400" rx="18" fill="url(#bg)"/>
<rect width="1200" height="400" rx="18" fill="url(#grid)" opacity=".45"/>
<rect x=".5" y=".5" width="1199" height="399" rx="18" fill="none" stroke="url(#neon)" stroke-opacity=".55"/>

