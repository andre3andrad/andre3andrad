<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#0d1326"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<style>.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}</style>
<rect width="1200" height="140" rx="18" fill="url(#bg)"/>
<rect width="1200" height="140" rx="18" fill="url(#grid)" opacity=".45"/>
<rect x=".5" y=".5" width="1199" height="139" rx="18" fill="none" stroke="url(#neon)" stroke-opacity=".55"/>

<clipPath id="cl"><rect width="1200" height="140" rx="18"/></clipPath>
<g clip-path="url(#cl)"><path fill="none" stroke="url(#neon)" stroke-width="2" opacity=".8"
d="M0 95 Q 75 65 150 95 T 300 95 T 450 95 T 600 95 T 750 95 T 900 95 T 1050 95 T 1200 95 T 1350 95 T 1500 95">
<animateTransform attributeName="transform" type="translate" values="0 0;-300 0" dur="5s" repeatCount="indefinite"/></path></g>
<text x="600.0" y="58" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="18" fill="#cbd5e1">// EOF — <tspan fill="#22d3ee">let's build something intelligent</tspan><tspan class="blink" fill="#22d3ee">_</tspan></text>

</svg>
