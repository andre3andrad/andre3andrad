<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#0d1326"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<linearGradient id="cg0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><linearGradient id="cg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient><linearGradient id="sw2" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<style>.sweep{animation:sw 6s ease-in-out infinite}@keyframes sw{from{transform:translateX(0)}to{transform:translateX(1440px)}}</style>
<rect width="1200" height="250" rx="18" fill="url(#bg)"/>
<rect width="1200" height="250" rx="18" fill="url(#grid)" opacity=".45"/>
<rect x=".5" y=".5" width="1199" height="249" rx="18" fill="none" stroke="url(#neon)" stroke-opacity=".55"/>
<text x="40" y="58" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="15" fill="#22d3ee">// CERTIFIED<tspan fill="#64748b">  —  verified learning, not just practice</tspan></text>
<rect x="40" y="86" width="550" height="130" rx="14" fill="#070b14" stroke="url(#cg0)" stroke-opacity=".7"/>
<polygon points="110.0,111.0 144.6,131.0 144.6,171.0 110.0,191.0 75.4,171.0 75.4,131.0" fill="#a78bfa" fill-opacity=".08" stroke="url(#cg0)" stroke-width="2.5">
  <animateTransform attributeName="transform" type="rotate" values="0 110 151.0;360 110 151.0" dur="24s" repeatCount="indefinite"/>
</polygon>
<path d="M96 151.0 l9 10 l20 -22" fill="none" stroke="url(#cg0)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
<text x="176" y="128" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="12" fill="#64748b" letter-spacing="2">CERTIFICATE://CLAUDE</text>
<text x="176" y="162" font-family="'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="url(#cg0)">ANTHROPIC ACADEMY</text>
<text x="176" y="190" font-family="'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#94a3b8">Official certificates · Claude</text>
<circle cx="564" cy="112" r="5" fill="#f472b6"><animate attributeName="opacity" values="1;.2;1" dur="2s" begin="0s" repeatCount="indefinite"/></circle>
<rect x="610" y="86" width="550" height="130" rx="14" fill="#070b14" stroke="url(#cg1)" stroke-opacity=".7"/>
<polygon points="680.0,111.0 714.6,131.0 714.6,171.0 680.0,191.0 645.4,171.0 645.4,131.0" fill="#22d3ee" fill-opacity=".08" stroke="url(#cg1)" stroke-width="2.5">
  <animateTransform attributeName="transform" type="rotate" values="0 680 151.0;360 680 151.0" dur="24s" repeatCount="indefinite"/>
</polygon>
<path d="M666 151.0 l9 10 l20 -22" fill="none" stroke="url(#cg1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
<text x="746" y="128" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="12" fill="#64748b" letter-spacing="2">CERTIFICATE://GOOGLE</text>
<text x="746" y="162" font-family="'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="url(#cg1)">GOOGLE ACADEMY</text>
<text x="746" y="190" font-family="'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#94a3b8">Official certificates · Google</text>
<circle cx="1134" cy="112" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.2;1" dur="2s" begin="1s" repeatCount="indefinite"/></circle><rect class="sweep" x="-240" y="86" width="240" height="130" fill="url(#sw2)"/>
</svg>
